<style>
  :root {
    /* Dawn palette */
    --bg-1: #f6ebdd;       /* warm cream */
    --bg-2: #f7e4dc;       /* pale blush */

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::-webkit-scrollbar { display: none; }
  html, body {
    height: 100%;
    background: #efe4d5;
    color: var(--fg);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .serif { font-family: 'Instrument Serif', 'Times New Roman', serif; font-style: italic; font-weight: 400; }
  .serif-up { font-family: 'Instrument Serif', serif; font-style: normal; font-weight: 400; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* Dawn background (per scene) */
  .dawn {
    background:
      radial-gradient(ellipse 70% 50% at 18% 8%, rgba(255,218,196,0.75), transparent 60%),
      radial-gradient(ellipse 60% 50% at 88% 14%, rgba(255,205,212,0.65), transparent 55%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(232,184,167,0.65), transparent 60%),
      linear-gradient(180deg, #f5e8d9 0%, #f6ecdf 45%, #f1d5cc 100%);
  }
  .dusk {
    background:
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(195,140,130,0.45), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 0%, rgba(255,212,200,0.65), transparent 55%),
      linear-gradient(180deg, #f3dccf 0%, #efcdc4 60%, #e6b9b1 100%);
  }
  .overcast {
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(220,210,200,0.7), transparent 60%),
      linear-gradient(180deg, #ede3d7 0%, #e6dccf 100%);
  }
  .golden {
    background:
      radial-gradient(ellipse 80% 60% at 50% 110%, rgba(216,151,90,0.55), transparent 55%),
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(255,228,200,0.7), transparent 55%),
      linear-gradient(180deg, #f7e2c8 0%, #f1cfb3 55%, #e0a987 100%);
  }

  /* Glass card for dawn surfaces */
  .dream-card {
    background: var(--cream-card);
    backdrop-filter: blur(16px) saturate(110%);
    -webkit-backdrop-filter: blur(16px) saturate(110%);
    border: 1px solid rgba(255,255,255,0.75);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.9),
      0 1px 2px rgba(160,100,80,0.06),
      0 18px 40px -16px rgba(160,100,80,0.18);
  }
  .dream-card-soft {
    background: rgba(255,250,242,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.55);
  }

  /* Animated bokeh layer */
  .bokeh {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bokeh-dot {
    position: absolute;
    border-radius: 50%;
    filter: blur(14px);
    opacity: 0.55;
    animation: drift 22s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(14px, -22px) scale(1.08); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 0.85; transform: scale(1.04); }
  }

  /* Polaroid */
  .polaroid {
    background: #fbf6ee;
    padding: 8px 8px 18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 10px 24px -10px rgba(160,100,80,0.25),
      0 2px 4px rgba(160,100,80,0.08);
    position: relative;
  }
  .polaroid::before {
    content: '';
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 38px; height: 14px;
    background: rgba(220,205,180,0.7);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .pol-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(255,230,210,0.9), rgba(220,170,150,0.6) 60%, rgba(180,107,94,0.7));
    position: relative;
  }
  /* (stripe overlay removed — real photos now occupy the polaroid frame) */

  @keyframes poster-in {
    from { opacity: 0; letter-spacing: 0; filter: blur(8px); }
    to   { opacity: 1; letter-spacing: -2.5px; filter: blur(0); }
  }
  @keyframes glow {
    0%, 100% { opacity: 0.45; transform: scale(1); }
    50%      { opacity: 0.75; transform: scale(1.05); }
  }

  /* ---------- PRINT ---------- */
  @page { size: A4 portrait; margin: 0; }
  body, html { background: #ede0d1; }
  .print-root { width: 100%; }
  .print-page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    page-break-after: always;
    break-after: page;
    box-sizing: border-box;
    position: relative;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .print-page:last-child { page-break-after: auto; break-after: auto; }
  .print-caption {
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    color: rgba(58, 44, 36, 0.55);
    text-align: center;
  }
  @media print {
    body, html, .print-root { background: #ede0d1 !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .print-page {
      min-height: auto;
      height: 100vh;
      padding: 18px 12px;
      page-break-after: always;
      break-after: page;
    }
  }
</style>

/* ---------- Primitives ---------- */
const PRINT_MODE = true;

function FadeIn({ children, delay = 0, duration = 1000, y = 10, style = {} }) {
  const [on, setOn] = useState(PRINT_MODE);
  useEffect(() => {
    if (PRINT_MODE) { setOn(true); return; }
    const t = setTimeout(() => setOn(true), delay);
    return () => clearTimeout(t);
  }, [delay]);
  return (
    <div style={{
      opacity: on ? 1 : 0,
      transform: on ? "translateY(0)" : `translateY(${y}px)`,
      transition: PRINT_MODE ? 'none' : `opacity ${duration}ms ease, transform ${duration}ms cubic-bezier(0.2, 0.6, 0.2, 1)`,
      ...style
    }}>{children}</div>);
}

function LogoMark({ size = 28, color = 'var(--fg)', opacity = 0.7 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 28 28" fill="none" style={{ flexShrink: 0 }}>
      <circle cx="14" cy="14" r="13" stroke={color} strokeOpacity={opacity} strokeWidth="1" />
      <circle cx="14" cy="14" r="5.5" stroke={color} strokeOpacity={opacity * 0.9} strokeWidth="1" />
      <circle cx="14" cy="14" r="1.2" fill={color} fillOpacity={opacity * 0.5} />
    </svg>);

}

function Bokeh({ tone = 'warm' }) {

  [
  { x: '14%', y: '18%', s: 160, c: 'rgba(255,212,184,0.65)', d: 0 },
  { x: '80%', y: '12%', s: 110, c: 'rgba(255,200,210,0.55)', d: 4 },
  { x: '50%', y: '85%', s: 200, c: 'rgba(216,151,108,0.45)', d: 2 },
  { x: '22%', y: '70%', s: 90, c: 'rgba(255,232,200,0.65)', d: 7 },
  { x: '88%', y: '62%', s: 80, c: 'rgba(255,194,178,0.55)', d: 10 }];

  return (
    <div className="bokeh">
      {dots.map((d, i) =>
      <div key={i} className="bokeh-dot" style={{
        left: d.x, top: d.y, width: d.s, height: d.s,
        background: d.c, animationDelay: `${d.d}s`

}

function _OldNavApp() {
  const [index, setIndex] = useState(0);
  const [transitioning, setTransitioning] = useState(false);
  const [mountKey, setMountKey] = useState(0);

  const go = (next) => {
    const clamped = Math.max(0, Math.min(SCENE_LIST.length - 1, next));
    if (clamped === index) return;
    setTransitioning(true);
    setTimeout(() => {
      setIndex(clamped);
      setMountKey((k) => k + 1);
      setTransitioning(false);
    }, 280);
  };
  const prev = () => go(index - 1);
  const next = () => go(index + 1);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {e.preventDefault();next();} else
      if (e.key === 'ArrowLeft') {e.preventDefault();prev();}
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [index]);

  const renderScene = () => {
    switch (SCENE_LIST[index].id) {
      case "intro":return <Intro onTap={next} />;
      case "lock":return <LockScreen />;
      case "app":return <AppHome />;
      case "memories":return <MemoryPackage />;
      case "chat":return <ChatScene />;
      case "feed":return <SocialFeed />;
      case "news":return <NewsScene />;
      case "final":return <FinalScene sceneElapsed={14000} />;
      default:return null;
    }
  };

  const atStart = index === 0;
  const atEnd = index === SCENE_LIST.length - 1;

  return (
    <div style={{
      width: '100vw', minHeight: '100vh',
      background:
      'radial-gradient(ellipse at 50% -10%, #f6dccc, transparent 60%), ' +
      'radial-gradient(ellipse at 50% 110%, #e8c2b8, transparent 55%), ' +
      '#ede0d1',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 24, position: 'relative'
    }}>

      {/* Left nav arrow */}
      <button
        onClick={prev}
        disabled={atStart}
        aria-label="Previous scene"
        style={{
          position: 'fixed',
          left: 28, top: '50%', transform: 'translateY(-50%)',
          width: 48, height: 48,
          borderRadius: '50%',
          border: '1px solid rgba(180,107,94,0.35)',
          background: 'rgba(255,251,244,0.7)',
          backdropFilter: 'blur(10px)',
          color: 'var(--rose)',
          cursor: atStart ? 'default' : 'pointer',
          opacity: atStart ? 0.25 : 1,
          transition: 'opacity 200ms ease, transform 200ms ease',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 18,
          zIndex: 50,
          boxShadow: '0 8px 20px -10px rgba(160,100,80,0.3)'
        }}>
        ←
      </button>

      {/* Right nav arrow */}
      <button
        onClick={next}
        disabled={atEnd}
        aria-label="Next scene"
        style={{
          position: 'fixed',
          right: 28, top: '50%', transform: 'translateY(-50%)',
          width: 48, height: 48,
          borderRadius: '50%',
          border: '1px solid rgba(180,107,94,0.35)',
          background: 'rgba(255,251,244,0.7)',
          backdropFilter: 'blur(10px)',
          color: 'var(--rose)',
          cursor: atEnd ? 'default' : 'pointer',
          opacity: atEnd ? 0.25 : 1,
          transition: 'opacity 200ms ease, transform 200ms ease',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 18,
          zIndex: 50,
          boxShadow: '0 8px 20px -10px rgba(160,100,80,0.3)'
        }}>
        →
      </button>

      {/* Phone frame */}
      <div style={{
        width: 375, height: 812,
        borderRadius: 50,
        overflow: 'hidden',
        position: 'relative',
        background: '#2a1f1a',
        boxShadow:
        '0 0 0 1px #c9b9a6, 0 0 0 8px #f1e2cf, ' +
        '0 30px 80px -10px rgba(120, 70, 50, 0.5), ' +
        'inset 0 0 0 1px rgba(255,255,255,0.06)'
      }}>
        {/* dynamic island */}
        <div style={{
          position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
          width: 122, height: 32, borderRadius: 20,
          background: '#2a1f1a', zIndex: 30
        }} />

        {/* status bar */}
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0, zIndex: 20,
          padding: '16px 28px 0',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          color: 'var(--fg)',
          fontSize: 13, fontWeight: 600,
          pointerEvents: 'none'
        }}>
          <span style={{ letterSpacing: -0.2 }}>9:41</span>
          <span style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <span className="mono" style={{ fontSize: 9, letterSpacing: 0.5, opacity: 0.85 }}>5G</span>
            <svg width="22" height="11" viewBox="0 0 22 11" fill="none">
              <rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="#3a2c24" strokeOpacity="0.6" />
              <rect x="2" y="2" width="15" height="7" rx="1.2" fill="#3a2c24" fillOpacity="0.85" />
              <rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="#3a2c24" fillOpacity="0.5" />
            </svg>
          </span>
        </div>

        {/* content */}
        <div key={mountKey} style={{
          position: 'absolute', inset: 0,
          opacity: transitioning ? 0 : 1,
          transition: 'opacity 280ms ease'
        }}>
          {renderScene()}
        </div>

        {/* Home indicator */}
        <div style={{
          position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
          width: 134, height: 5, borderRadius: 3,
          background: 'rgba(58, 44, 36, 0.4)',
          zIndex: 30
        }} />
      </div>

      {/* Scene indicator + label */}
      <div style={{
        position: 'fixed', bottom: 28, left: 0, right: 0,
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10,
        pointerEvents: 'none'
      }}>
        <div style={{ display: 'flex', gap: 7, pointerEvents: 'auto' }}>
          {SCENE_LIST.map((s, i) =>
          <button
            key={s.id}
            onClick={() => go(i)}
            aria-label={`Go to ${s.label}`}
            style={{
              width: i === index ? 22 : 7,
              height: 7,
              borderRadius: 999,
              border: 'none',
              background: i === index ? 'var(--rose)' : 'rgba(180,107,94,0.3)',
              cursor: 'pointer',
              padding: 0,
              transition: 'width 250ms ease, background 250ms ease'
            }} />

          )}
        </div>
        <div className="mono" style={{
          fontSize: 9, letterSpacing: 3,
          color: 'rgba(58, 44, 36, 0.55)'
        }}>
          {String(index + 1).padStart(2, '0')} / {String(SCENE_LIST.length).padStart(2, '0')} &nbsp;·&nbsp; {SCENE_LIST[index].label.toUpperCase()}
        </div>
        <div className="mono" style={{
          fontSize: 8, letterSpacing: 2,
          color: 'rgba(58, 44, 36, 0.35)'
        }}>
          ← / → &nbsp; or click dots
        </div>
      </div>
    </div>);

}
